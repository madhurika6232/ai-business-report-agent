name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate Release Version

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(cat VERSION)"
          tag="${GITHUB_REF_NAME}"

          echo "VERSION file: $version"
          echo "Git tag: $tag"

          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match VERSION $version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  release-validation:
    name: Release Validation

    needs:
      - validate-version

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      CI_DATA_VERSION: ci-data-v1
      CI_DATA_FILE: retailops-ci-data-v1.0.0.zip
      CI_DATA_SHA256: 381E65B8054DD4339DB148A9A7DB353CECC54E815CE16144AEACEC28E7504789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate backend dependencies
        run: pip check

      - name: Download regression fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/retailops-ci

          gh release download "$CI_DATA_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CI_DATA_FILE" \
            --dir /tmp/retailops-ci

      - name: Verify regression fixture checksum
        shell: bash
        run: |
          echo \
            "$CI_DATA_SHA256  /tmp/retailops-ci/$CI_DATA_FILE" \
            | sha256sum --check -

      - name: Restore regression fixtures
        shell: python
        run: |
          import os
          import shutil
          import zipfile

          archive = os.path.join(
              "/tmp/retailops-ci",
              os.environ["CI_DATA_FILE"],
          )

          workspace = os.path.abspath(".")

          with zipfile.ZipFile(archive) as source:
              for member in source.infolist():
                  normalized = member.filename.replace(
                      "\\",
                      "/",
                  )

                  normalized = normalized.lstrip("/")

                  if (
                      not normalized
                      or normalized.endswith("/")
                  ):
                      continue

                  destination = os.path.abspath(
                      os.path.join(
                          workspace,
                          normalized,
                      )
                  )

                  if os.path.commonpath(
                      [
                          workspace,
                          destination,
                      ]
                  ) != workspace:
                      raise RuntimeError(
                          "Unsafe archive path: "
                          f"{member.filename}"
                      )

                  parent = os.path.dirname(
                      destination
                  )

                  os.makedirs(
                      parent,
                      exist_ok=True,
                  )

                  with source.open(member) as src:
                      with open(
                          destination,
                          "wb",
                      ) as dst:
                          shutil.copyfileobj(
                              src,
                              dst,
                          )

          required = [
              (
                  "data/processed/"
                  "orders_enriched.csv"
              ),
              (
                  "data/processed/"
                  "seller_metrics.csv"
              ),
              (
                  "data/processed/"
                  "category_metrics.csv"
              ),
              (
                  "data/processed/"
                  "review_sample_classifications.csv"
              ),
              (
                  "models/"
                  "delivery_risk_model.joblib"
              ),
          ]

          for path in required:
              if not os.path.isfile(path):
                  raise FileNotFoundError(
                      "Missing regression fixture: "
                      f"{path}"
                  )

              size = os.path.getsize(path)

              print(
                  f"Restored: {path} "
                  f"({size:,} bytes)"
              )

      - name: Run backend regression
        env:
          RETAILOPS_ENV: testing
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Scan frontend bundle
        shell: bash
        run: |
          if grep -R -E \
            "GROQ_API_KEY|RETAILOPS_API_KEY|VITE_RETAILOPS_API_KEY" \
            frontend/dist; then

            echo "Forbidden secret reference found in frontend bundle."
            exit 1
          fi

          echo "Frontend bundle security check passed."

      - name: Build backend release image
        run: |
          docker build \
            -t "retailops-ai:${{ needs.validate-version.outputs.version }}" \
            .

      - name: Build frontend release image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="" \
            -t "retailops-frontend:${{ needs.validate-version.outputs.version }}" \
            ./frontend

  github-release:
    name: Publish GitHub Release

    needs:
      - validate-version
      - release-validation

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "RetailOps AI ${GITHUB_REF_NAME}" \
            --generate-notes