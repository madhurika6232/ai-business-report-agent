name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      RETAILOPS_ENV: testing
      CI_DATA_VERSION: ci-data-v1
      CI_DATA_FILE: retailops-ci-data-v1.0.0.zip
      CI_DATA_SHA256: 1B8B913CB823B45DAEBD8EA3BC188A99D54B090D4E731E604AF9DFE6FB006162

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate dependency environment
        run: pip check

      - name: Run API tests
        run: python -m pytest tests/api -q

      - name: Download regression fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CI_DATA_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CI_DATA_FILE" \
            --dir /tmp/retailops-ci

      - name: Verify regression fixture checksum
        shell: bash
        run: |
          echo \
            "$CI_DATA_SHA256  /tmp/retailops-ci/$CI_DATA_FILE" \
            | sha256sum --check -

      - name: Restore processed regression data
        run: |
          mkdir -p data/processed

          unzip -q \
            "/tmp/retailops-ci/$CI_DATA_FILE" \
            -d data/processed

          echo "Restored regression datasets:"
          ls -lh data/processed

      - name: Run full Python regression
        run: python -m pytest -q