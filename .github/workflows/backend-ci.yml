name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      RETAILOPS_ENV: testing
      CI_DATA_VERSION: ci-data-v1
      CI_DATA_FILE: retailops-ci-data-v1.0.0.zip
      CI_DATA_SHA256: 381E65B8054DD4339DB148A9A7DB353CECC54E815CE16144AEACEC28E7504789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate dependency environment
        run: pip check

      - name: Run API tests
        run: python -m pytest tests/api -q

      - name: Download regression fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CI_DATA_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CI_DATA_FILE" \
            --dir /tmp/retailops-ci

      - name: Verify regression fixture checksum
        shell: bash
        run: |
          echo \
            "$CI_DATA_SHA256  /tmp/retailops-ci/$CI_DATA_FILE" \
            | sha256sum --check -

      - name: Restore regression fixtures
        run: |
          unzip -q \
            "/tmp/retailops-ci/$CI_DATA_FILE" \
            -d .

          echo "Restored processed datasets:"
          ls -lh data/processed

          echo "Restored ML model:"
          ls -lh models/delivery_risk_model.joblib

          test -f data/processed/orders_enriched.csv
          test -f data/processed/seller_metrics.csv
          test -f data/processed/category_metrics.csv
          test -f data/processed/review_sample_classifications.csv
          test -f models/delivery_risk_model.joblib

      - name: Run full Python regression
        run: python -m pytest -q