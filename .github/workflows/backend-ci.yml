name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      RETAILOPS_ENV: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate dependency environment
        run: pip check

      - name: Run API tests
        run: python -m pytest tests/api -q

      - name: Run full Python regression
        run: python -m pytest -q