name: Integration CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: Production Stack Smoke Test

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI runtime environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          RETAILOPS_ENV=testing
          GROQ_API_KEY=ci-placeholder-groq-key
          RETAILOPS_API_KEY=ci-integration-api-key
          RETAILOPS_API_DEBUG=false
          RETAILOPS_API_DOCS_ENABLED=false
          RETAILOPS_CORS_ORIGINS=http://localhost:8080
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production stack
        run: docker compose build

      - name: Start production stack
        run: docker compose up -d

      - name: Wait for services
        shell: bash
        run: |
          timeout 120 bash -c '
            until [ "$(docker inspect \
              --format="{{.State.Health.Status}}" \
              retailops-backend 2>/dev/null)" = "healthy" ] &&
                  [ "$(docker inspect \
              --format="{{.State.Health.Status}}" \
              retailops-frontend 2>/dev/null)" = "healthy" ];
            do
              echo "Waiting for RetailOps containers..."
              sleep 5
            done
          '

      - name: Show container status
        run: docker compose ps

      - name: Verify health endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8080/health

      - name: Verify readiness endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8080/ready

      - name: Verify SPA root
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8080/ \
            | grep -q '<div id="root">'

      - name: Verify SPA route fallback
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8080/skills \
            | grep -q '<div id="root">'

      - name: Verify protected API proxy
        shell: bash
        run: |
          status="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://localhost:8080/api/v1/sessions/ci-missing-session
          )"

          if [ "$status" != "404" ]; then
            echo "Expected authenticated missing session to return 404."
            echo "Received HTTP $status."
            exit 1
          fi

          echo "Protected proxy authentication passed."

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop production stack
        if: always()
        run: docker compose down -v