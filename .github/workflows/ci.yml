name: RetailOps CI

on:
  workflow_run:
    workflows:
      - Backend CI
      - Frontend CI
      - Security CI
      - Docker CI
      - Integration CI

    types:
      - completed

permissions:
  contents: read

jobs:
  report:
    name: CI Gate Status

    runs-on: ubuntu-latest

    steps:
      - name: Verify completed workflow
        shell: bash
        run: |
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"

          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Required RetailOps CI workflow failed."
            exit 1
          fi

          echo "Required RetailOps CI workflow passed."