services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: retailops-ai:phase13

    container_name: retailops-backend

    env_file:
      - .env

    expose:
      - "8000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""

    image: retailops-frontend:phase13

    container_name: retailops-frontend

    env_file:
      - .env

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3